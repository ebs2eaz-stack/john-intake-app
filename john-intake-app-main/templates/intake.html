<!DOCTYPE html>
<html>
<head>
    <title>KP KREATIONS | Book Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>KP KREATIONS</h1>
    <img src="{{ url_for('static', filename='images/hero.png') }}"
     alt="KP KREATIONS Hair Styling"
     style="width:100%; max-width:700px; height:auto; border-radius:12px; display:block; margin:20px auto 30px auto;">
    <div style="text-align:center; margin:25px 0 30px 0;">
    <h2 style="margin-bottom:8px;">Book Your Hair Appointment</h2>
    <p style="font-size:17px; margin:0;">
        Tell us about your hair and the style you're looking for.
    </p>
</div>
<form method="POST" enctype="multipart/form-data">
    {% if error %}
    <div style="background:#ffe5e5; color:#a00000; padding:12px; margin-bottom:20px; border-radius:6px; font-weight:bold;">
        {{ error }}
    </div>
{% endif %}
<div style="margin-bottom:25px;">
    <a href="/" style="text-decoration:none; font-weight:bold;">
        ← Back to Home
    </a>
</div>


        <h2>Client Information</h2>

        <label>Full Name</label>
        <input type="text" name="client_name" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <label>Email</label>
        <input type="email" name="email">

        <hr>

        <h2>Appointment Details</h2>

        <label>Service</label>
        <select name="service" id="service" required>
    <option value="">Select a Service</option>
    <option value="Cornrows">Cornrows</option>
    <option value="Lemonades">Lemonades</option>
    <option value="Knotless Braids">Knotless Braids</option>
    <option value="Bohemian Knotless">Bohemian Knotless</option>
    <option value="Feed In Buns">Feed In Buns</option>
    <option value="Two Braids">Two Braids</option>
    <option value="Pop Smokes">Pop Smokes</option>
    <option value="Pop Smoke Singles">Pop Smoke Singles</option>
    <option value="Braided Ponytail">Braided Ponytail</option>
    <option value="Half & Half Braids">Half & Half Braids</option>
    <option value="Touch Ups">Touch Ups</option>
    <option value="Traditional Sew In">Traditional Sew In</option>
    <option value="Regular Quickweaves">Regular Quickweaves</option>
    <option value="Half & Half Sew Ins">Half & Half Sew Ins</option>
    <option value="Weave Ponytails">Weave Ponytails</option>
    <option value="Ponytails">Ponytails</option>
    <option value="Natural Hair">Natural Hair</option>
    <option value="Men Style">Men Style</option>

</select>
<label>Service Option / Price</label>
<select name="service_option" id="service_option">
    <option value="">Select a Service First</option>
</select>
        <label>Stylist</label>
        <input type="text" name="stylist">

        <label>Appointment Date</label>
        <input type="date" name="appointment_date" required>

        <label>Appointment Time</label>
        <input type="time" name="appointment_time" required>

        <hr>

        <h2>Hair Information</h2>

        <label>Hair Type</label>
        <select name="hair_type">
            <option value="">Select Hair Type</option>
            <option value="Straight">Straight</option>
            <option value="Wavy">Wavy</option>
            <option value="Curly">Curly</option>
            <option value="Coily">Coily</option>
            <option value="Locs">Locs</option>
        </select>

        <label>Hair Length</label>
        <select name="hair_length">
            <option value="">Select Hair Length</option>
            <option value="Short">Short</option>
            <option value="Shoulder Length">Shoulder Length</option>
            <option value="Mid Back">Mid Back</option>
            <option value="Long">Long</option>
        </select>
<label>Notes / Special Requests</label>
<textarea name="notes" rows="5"></textarea>

<label>Hairstyle Inspiration Photo</label>
<p class="subtitle">Upload a photo of the hairstyle you would like.</p>

<input type="file"
       name="photo"
       accept=".jpg,.jpeg,.png,.webp">

<br><br>

<button type="submit">Book Appointment</button>

        
    </form>

</div>
<script>

</script>
</body>
</html>
